<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<meta name="application-name" content="Kora_LOC 운송 일정">

<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<script src="https://t1.kakaocdn.net/kakao_js_sdk/2.7.4/kakao.min.js" crossorigin="anonymous"></script>
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; max-width: 480px; margin: 0 auto; padding: 12px; background: #f5f5f5; }
  h1 { text-align: center; background: #3c1e1e; color: #fee500; padding: 16px; border-radius: 12px; margin: 0 0 12px 0; font-size: 20px; }
  .info { text-align: center; background: #fff3cd; padding: 10px; border-radius: 8px; margin-bottom: 14px; font-size: 14px; }
  .nav { display: flex; gap: 6px; margin-bottom: 12px; }
  .nav button, .nav input { flex: 1; padding: 12px 6px; border: none; border-radius: 8px; font-size: 15px; background: #fff; }
  .nav input { flex: 2; text-align: center; }
  .group { background: white; border-radius: 12px; padding: 14px; margin-bottom: 14px; }
  .group-title { font-weight: bold; margin-bottom: 10px; font-size: 16px; }
  .btn { width: 100%; padding: 14px; margin-bottom: 8px; background: #fee500; border: none; border-radius: 10px; font-size: 15px; font-weight: bold; text-align: left; }
  .btn.used { background: #ddd; color: #777; }
  .btn.changed { background: #e53935; color: #fff; }
  #diffLine { display: none; font-size: 13px; color: #e53935; font-weight: bold; margin-bottom: 8px; }
  #msgBox { display: none; margin-top: 6px; background: white; border-radius: 12px; padding: 14px; margin-bottom: 14px; box-shadow: 0 2px 8px rgba(0,0,0,0.15); }
  #msgContent { background: #f8f8f8; padding: 14px; border-radius: 8px; white-space: pre-wrap; font-family: monospace; font-size: 15px; line-height: 1.6; border: 2px solid #fee500; margin-bottom: 10px; user-select: text; -webkit-user-select: text; }
  .send-btn { width: 100%; padding: 16px; background: #fee500; color: #3c1e1e; border: 2px solid #3c1e1e; border-radius: 8px; font-size: 17px; font-weight: bold; margin-bottom: 8px; }
  .copy-btn { width: 100%; padding: 12px; background: #3c1e1e; color: #fee500; border: none; border-radius: 8px; font-size: 15px; font-weight: bold; margin-bottom: 8px; }
  .kakao-btn { width: 100%; padding: 12px; background: #fff; color: #3c1e1e; border: 1px solid #3c1e1e; border-radius: 8px; font-size: 14px; }
  .status { text-align: center; font-weight: bold; color: #2e7d32; margin: 8px 0; min-height: 24px; }
  .refresh { text-align: center; font-size: 12px; color: #888; margin: -6px 0 6px; }
  .btn.run { background: #1e88e5; color: #fff; }
  .btn.done { background: #9e9e9e; color: #fff; }
  .btn.shared { background: #cfe2f3; color: #1a3550; }
  .btn.changed { background: #e53935; color: #fff; }
  .btn:disabled { opacity: 1; }
  #timeLine { display: none; font-size: 12px; color: #1e88e5; margin-bottom: 6px; }
  .btn.cancelled { background: #e0e0e0; color: #777; }
  .btn.cancelled.cancel-alert { border: 3px solid #e53935; color: #c62828; }
  .state-row { display: flex; gap: 8px; margin-top: 10px; }
  .state-btn { flex: 2; padding: 14px; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; background: #1e88e5; color: #fff; }
  .state-btn.to-done { background: #43a047; }
  .state-btn:disabled, .undo-btn:disabled { opacity: .5; }
  .undo-btn { flex: 1; padding: 14px; border: 1px solid #999; border-radius: 8px; background: #fff; font-size: 14px; }
  .box-state { white-space: pre-line; text-align: center; font-size: 13px; color: #555; margin-top: 6px; }
  .close-btn { width: 100%; margin-top: 8px; padding: 10px; border: none; border-radius: 8px; background: #eee; }
  .done-row { display: flex; align-items: center; gap: 8px; }
  .done-row .btn { flex: 1; }
  .undo { font-size: 12px; color: #555; white-space: nowrap; margin-bottom: 8px; }
  .btn.pending { border: 2px dashed #3c1e1e; }
  .send-btn:disabled { background: #eee; color: #999; border-color: #ccc; }
  .pend-note { display: none; font-size: 13px; color: #b26a00; margin: -2px 0 8px; }
  .settings { background: #fff; border-radius: 12px; padding: 12px; margin: 14px 0; font-size: 13px; }
  .settings input { width: 100%; box-sizing: border-box; padding: 10px; margin: 4px 0 8px; border: 1px solid #ccc; border-radius: 6px; font-size: 14px; }
  .settings button { width: 100%; padding: 10px; background: #3c1e1e; color: #fee500; border: none; border-radius: 8px; font-weight: bold; }
  .set-title { font-weight: bold; margin-top: 4px; }
  .set-cur { color: #666; font-size: 12px; margin-top: 4px; word-break: break-all; }
  .reset { width: 100%; padding: 12px; background: #eee; border: none; border-radius: 8px; }
  .skip { font-size: 12px; color: #888; margin: 8px 0 14px; white-space: pre-wrap; }
  #board { display: none; background: #fff; border-radius: 12px; padding: 10px 12px; margin-bottom: 14px; }
  .bd-title { font-weight: bold; font-size: 15px; margin-bottom: 6px; }
  .bd-row { display: flex; align-items: center; gap: 8px; padding: 8px 0; border-top: 1px solid #eee; cursor: pointer; }
  .bd-row:first-of-type { border-top: none; }
  .bd-main { flex: 1; min-width: 0; }
  .bd-veh { font-weight: bold; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .bd-sub { font-size: 12px; color: #555; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .bd-badge { font-size: 12px; font-weight: bold; padding: 4px 8px; border-radius: 12px; white-space: nowrap; }
  .bd-badge.run { background: #1e88e5; color: #fff; }
  .bd-badge.shared { background: #cfe2f3; color: #1a3550; }
  .bd-late { font-size: 12px; color: #e53935; font-weight: bold; margin-top: 2px; }
  .bd-badge.wait { background: #fee500; color: #3c1e1e; }
  .bd-badge.end { background: #9e9e9e; color: #fff; }
  .bd-cnt { font-size: 11px; color: #888; white-space: nowrap; }
</style>
</head>
<body>
<h1 onclick="goToday()" style="cursor:pointer">Kora_LOC 운송 일정<span id="carTag"></span></h1>
<div class="nav">
  <button onclick="shift(-1)">◀ 전날</button>
  <input type="date" id="datePick" onchange="pick(this.value)">
  <button onclick="shift(1)">다음날 ▶</button>
</div>
<div class="info" id="info">불러오는 중…</div>
<div class="refresh" id="lastRefresh"></div>
<div class="status" id="status"></div>
<div id="board"></div>
<div id="msgBox">
  <div id="timeLine"></div>
  <div id="diffLine"></div>
  <div id="msgContent"></div>
  <button class="send-btn" id="sendBtn" onclick="sendKakao()">💬 카톡으로 보내기</button>
  <div class="pend-note" id="pendNote">Consol No.가 아직 없어요 (16시 이후 업데이트). 카톡 보내기는 Consol No.가 나온 뒤에 — 지금은 복사만 가능.</div>
  <button class="copy-btn" onclick="copyMsg()">메시지 복사하기</button>
  <button class="kakao-btn" id="kakaoBtn" style="display:none" onclick="sendViaKakaoSdk()">카카오 공유(SDK)로 보내기</button>
  <div class="state-row">
    <button class="state-btn" id="stateBtn" onclick="boxStateTap()"></button>
    <button class="undo-btn" id="undoBtn" onclick="boxUndoTap()">되돌리기</button>
  </div>
  <div class="box-state" id="boxState"></div>
  <button class="close-btn" onclick="closeBox()">닫기</button>
</div>
<div id="container"></div>
<div class="skip" id="skipped"></div>
<div class="settings" id="adminSettings" style="display:none">
  <div class="set-title">⚙ 이번 달 시트 주소</div>
  <div class="set-cur" id="curSheet">현재: 불러오는 중…</div>
  <input id="sheetUrl" placeholder="구글 시트 주소 또는 ID">
  <button onclick="saveSheet()">저장</button>
  <div class="set-cur" id="setMsg">※ 구글 시트(네이티브)만 가능 · 엑셀(.xlsx)은 'Google Sheets로 저장' 후 사용</div>
</div>
<button class="reset" id="adminReset" style="display:none" onclick="resetAll()">보냄·진행 표시 초기화 (이 날짜)</button>
<script>
// ── GitHub Pages 버전: Apps Script JSON API 호출 ──
const GAS_URL = 'https://script.google.com/macros/s/AKfycbwAHlScc1rdABNJQPGKJkmRF0ZsE_Urm-shAIGRcEkpyrord5u-Mp4I6fLg1fiWVWkx/exec';
const QS = new URLSearchParams(location.search);
const AUTH = QS.get('key') ? { key: QS.get('key') } : { car: QS.get('car') || '' };
let KAKAO_JS_KEY = '', APP_URL = location.origin + location.pathname;
let curD = /^\d{4}$/.test(QS.get('d') || '') ? QS.get('d') : '';
let MODE = 'none', CAR = '';
function jsonp(params) {
  return new Promise((ok, no) => {
    const cb = '__gas' + Date.now() + Math.floor(Math.random() * 1e6), s = document.createElement('script');
    const clean = () => { delete window[cb]; s.remove(); clearTimeout(t); };
    const t = setTimeout(() => { clean(); no(new Error('시간 초과')); }, 45000);
    window[cb] = r => { clean(); ok(r); };
    s.onerror = () => { clean(); no(new Error('네트워크 오류')); };
    params.set('callback', cb); s.src = GAS_URL + '?' + params; document.head.appendChild(s);
  });
}
// api(name, extra) → Promise(결과). fetch(GET, CORS) 실패 시 JSONP로 재시도
function api(name, extra) {
  const q = new URLSearchParams(Object.assign({ api: name }, AUTH));
  for (const k in (extra || {})) q.set(k, typeof extra[k] === 'string' ? extra[k] : JSON.stringify(extra[k]));
  return fetch(GAS_URL + '?' + q, { method: 'GET', redirect: 'follow', credentials: 'omit' })
    .then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
    .catch(() => jsonp(q))
    .then(r => { if (r && r._err) throw new Error(r.error || '서버 오류'); return r; });
}
// 예전 script.run 과 같은 모양: run().withSuccessHandler(f).withFailureHandler(g).함수(...)
const ARGS = { getCards: (d, a) => ({ d: d }), logProgress: (a, info) => ({ info: info }),
               getSheetInfo: a => ({}), setSheet: (url, a) => ({ url: url }), config: () => ({}) };
function run() {
  let ok = () => {}, fail = () => {};
  const o = { withSuccessHandler(f) { ok = f; return o; }, withFailureHandler(f) { fail = f; return o; } };
  for (const n in ARGS) o[n] = (...args) => { api(n, ARGS[n](...args)).then(r => ok(r), e => fail(e)); };
  return o;
}
// 카톡 메시지 맨 위 안내 (상차 현장 준비용)
const MSG_HEAD = '🚚 곧 도착합니다. (약 5분 후)';
const outMsg = m => m.replace(/^([^\n]*)\n\s*\n(→)/, '$1\n$2').replace(/\s+$/, '') + '\n\n' + MSG_HEAD;
let data = {}, currentMsg = '', currentId = null, currentItem = null;
const YEAR = new Date().getFullYear();

let kakaoReady = false;
try { if (KAKAO_JS_KEY && window.Kakao) { if (!Kakao.isInitialized()) Kakao.init(KAKAO_JS_KEY); kakaoReady = Kakao.isInitialized(); } } catch (e) {}
if (kakaoReady) document.getElementById('kakaoBtn').style.display = 'block';

// 보낸 기록: { sid: {S번호: 보낸텍스트}, rk: {'route|차수': {s, msg}} }  (날짜별 키)
const sentKey = () => 'sent_' + curD;
const getSent = () => { try { return JSON.parse(localStorage.getItem(sentKey())) || { sid: {}, rk: {} }; } catch (e) { return { sid: {}, rk: {} }; } };
const rkOf = item => item.rk || (item.route + '|' + item.n);
function setSent(item) {
  const st = getSent();
  st.sid[item.id] = item.msg;
  st.rk[rkOf(item)] = { s: item.id, msg: item.msg };
  localStorage.setItem(sentKey(), JSON.stringify(st));
}
function unSent(item) {
  const st = getSent();
  delete st.sid[item.id]; delete st.rk[rkOf(item)];
  for (const k in st.sid) if (st.sid[k] === item.msg) delete st.sid[k];
  for (const k in st.rk) if (st.rk[k] && (st.rk[k].s === item.id || st.rk[k].msg === item.msg)) delete st.rk[k];
  localStorage.setItem(sentKey(), JSON.stringify(st));
  // 다른 날짜 키에 남은 기록도 정리
  for (let i = 0; i < localStorage.length; i++) {
    const key = localStorage.key(i); if (!key || key.indexOf('sent_') !== 0 || key === sentKey()) continue;
    try { const o = JSON.parse(localStorage.getItem(key)); if (o && o.sid && o.sid[item.id] != null) { delete o.sid[item.id]; localStorage.setItem(key, JSON.stringify(o)); } } catch (e) {}
  }
}
// v26: 같은 노선|차수 카드가 여럿이면 서버가 키에 차량번호를 붙임 (노선|차수|#5833, item.rkBase = 예전 키).
// 예전 키로 저장된 보냄 기록은 보낸 문구에 이 카드 차량번호가 들어 있을 때만 이 카드 것으로 봄 (애매하면 무시)
function oldRkSent_(item, st) {
  if (!item.rkBase) return undefined;
  const o = st.rk[item.rkBase], m = String(item.veh || '').match(/\d{4}(?!.*\d{4})/);
  return o && m && String(o.msg || '').indexOf(m[0]) >= 0 ? o : undefined;
}
// 반환: {state:'none'|'sent'|'changed', prev: 이전 보낸 텍스트}
function sentState(item, st) {
  st = st || getSent();
  const bySid = st.sid[item.id], byRk = st.rk[rkOf(item)] || oldRkSent_(item, st);
  if (bySid != null) return bySid === item.msg ? { state: 'sent' } : { state: 'changed', prev: bySid };
  if (byRk && byRk.s !== item.id) return { state: 'changed', prev: byRk.msg };
  return { state: 'none' };
}
function fieldsOf(msg) {
  const L = String(msg).split('\n'), f = {};
  const val = re => { const l = L.find(x => re.test(x)); return l ? l.replace(re, '').trim() : ''; };
  f['Consol No.'] = val(/^→\s*/); f['Route'] = val(/^▶ Route\s*:\s*/);
  f['납입일자'] = val(/^▶ 납입일자\s*:\s*/); f['납입시간'] = val(/^▶ 납입시간\s*:\s*/);
  const tail = L.slice(L.lastIndexOf('') + 1);
  f['차량'] = tail[0] || ''; f['연락처'] = tail[1] || '';
  return f;
}
function diffLine(prev, cur) {
  const a = fieldsOf(prev), b = fieldsOf(cur), out = [];
  for (const k of Object.keys(b)) {
    if (a[k] === b[k]) continue;
    out.push(k === '차량' || k === '연락처' ? k : k + ' ' + (a[k] || '∅') + '→' + (b[k] || '∅'));
  }
  return out.length ? '바뀜: ' + out.join(', ') : '바뀜: 메시지 내용';
}
function say(t) { document.getElementById('status').textContent = t; }

function mmddToDate(d) { return new Date(YEAR, +d.slice(0, 2) - 1, +d.slice(2)); }
function dateToMmdd(dt) { return ('0' + (dt.getMonth() + 1)).slice(-2) + ('0' + dt.getDate()).slice(-2); }
function isoOf(dt) { return dt.getFullYear() + '-' + ('0' + (dt.getMonth() + 1)).slice(-2) + '-' + ('0' + dt.getDate()).slice(-2); }
// 제목 클릭 → 오늘 근무일 (07:00 이전은 전날 근무일)
function todayMmdd() { const dt = new Date(); if (dt.getHours() < 7) dt.setDate(dt.getDate() - 1); if (dt.getDay() === 0) dt.setDate(dt.getDate() + 1); return dateToMmdd(dt); }   // 일요일 휴무 → 월요일
function goToday() { closeBox(); load(todayMmdd()); }
function shift(n) { const dt = mmddToDate(curD); dt.setDate(dt.getDate() + n); load(dateToMmdd(dt)); }
function pick(v) { if (v) load(v.slice(5, 7) + v.slice(8, 10)); }

let loading = false;
function load(d, silent) {
  if (silent && loading) return;
  loading = true;
  if (!silent) {
    curD = d; data = {};
    document.getElementById('datePick').value = isoOf(mmddToDate(d));
    document.getElementById('msgBox').style.display = 'none';
    currentItem = null; currentMsg = ''; currentId = null;
    document.getElementById('container').innerHTML = '';
    document.getElementById('skipped').textContent = '';
    document.getElementById('info').textContent = d + ' 불러오는 중…';
  }
  run()
    .withSuccessHandler(res => {
      loading = false;
      if (res.d !== curD) return;   // 갱신 중 날짜가 바뀐 경우 무시
      stampRefresh();
      if (!res.ok) { document.getElementById('info').textContent = res.error; return; }
      data = res.groups;
      mergeProgress(res.progress);
      document.getElementById('info').textContent = res.d + ' (' + res.date + ') · ' + res.count + '건 · 배차 버튼 → [카톡으로 보내기] → 방 선택';
      if (res.skipped.length) document.getElementById('skipped').textContent = '제외: \n' + res.skipped.join('\n');
      else document.getElementById('skipped').textContent = '';
      render();
      if (silent) syncOpenCard();
    })
    .withFailureHandler(err => { loading = false; if (silent) return; document.getElementById('info').textContent = '오류: ' + err.message; })
    .getCards(d, AUTH);
}

// 열린 메시지 상자 유지: 같은 S번호(없으면 같은 노선+차수) 카드를 찾아 내용 갱신, 사라졌으면 닫기
function syncOpenCard() {
  if (!currentItem || document.getElementById('msgBox').style.display !== 'block') return;
  const all = [].concat(...Object.values(data));
  let hit = all.find(x => x.id === currentItem.id) || all.find(x => rkOf(x) === rkOf(currentItem));
  if (hit && hit.cancelled) { document.getElementById('msgBox').style.display = 'none'; currentItem = null; currentMsg = ''; currentId = null; say('열려 있던 배차가 취소됐어요.'); return; }
  if (!hit) { document.getElementById('msgBox').style.display = 'none'; currentItem = null; currentMsg = ''; currentId = null; say('열려 있던 배차가 시트에서 사라졌어요.'); return; }
  if (outMsg(hit.msg) !== currentMsg || hit.id !== currentId) {
    currentMsg = outMsg(hit.msg); currentId = hit.id; currentItem = hit; applyPending(hit);
    document.getElementById('msgContent').textContent = outMsg(hit.msg);
    const ss = sentState(hit), dl = document.getElementById('diffLine');
    dl.textContent = ss.state === 'changed' ? diffLine(ss.prev, hit.msg) : '';
    dl.style.display = ss.state === 'changed' ? 'block' : 'none';
    say('내용이 갱신됐어요.');
  } else { currentItem = hit; applyPending(hit); }
  updateBox();
}
function stampRefresh() {
  const n = new Date(), p = x => ('0' + x).slice(-2);
  document.getElementById('lastRefresh').textContent = '마지막 갱신 ' + p(n.getHours()) + ':' + p(n.getMinutes()) + ':' + p(n.getSeconds()) + ' · v29';
}
setInterval(() => { if (!document.hidden && curD) load(curD, true); }, 60000);
document.addEventListener('visibilitychange', () => { if (!document.hidden && curD) load(curD, true); });

function resetAll() {
  if (!confirm('이 날짜의 보냄·진행중·완료 표시를 모두 지울까요?')) return;
  localStorage.removeItem(sentKey()); localStorage.removeItem(progKey()); render();
  run().withSuccessHandler(r => { if (!r || !r.ok) say('기록 실패 (서버 초기화)'); })
    .withFailureHandler(() => say('기록 실패 (서버 초기화)')).logProgress(AUTH, { d: curD, rk: '*', state: 'reset' });  serverProg = {};
  document.getElementById('msgBox').style.display = 'none';
  say('초기화됨'); setTimeout(() => say(''), 2000);
}

// 진행 상태: 대기(없음) → 'shared' 공유됨(카톡 보내기) → 'run' 운행중 → 'done' 완료 (대기→운행중 바로도 가능).  날짜별, 카드키(노선|차수[|야간])로 저장 → S번호가 새로 나와도 유지
const progKey = () => 'prog_' + curD;
// 저장형식: {카드키: {s:'run'|'done', t:ms, start:'HH:MM', done:'HH:MM'}}  (예전 문자열 값도 읽음)
const getProgRaw = () => { try { return JSON.parse(localStorage.getItem(progKey())) || {}; } catch (e) { return {}; } };
const getProg = () => { const r = getProgRaw(), o = {}; for (const k in r) { const v = r[k]; const s = typeof v === 'string' ? v : v && v.s; if (s) o[k] = s; } return o; };
const progInfo = item => { const v = getProgRaw()[rkOf(item)]; return v && typeof v === 'object' ? v : {}; };
function saveProgRaw(p) { localStorage.setItem(progKey(), JSON.stringify(p)); }
const hmNow = () => { const n = new Date(); return ('0' + n.getHours()).slice(-2) + ':' + ('0' + n.getMinutes()).slice(-2); };
// 상태 변경은 서버 확인 후에만 반영 (서버가 기준). busy: 처리중인 카드키
const busy = {};

function applyServerProg(item, sp) {

// from → to 요청. 성공 시 onOk() 실행
function requestProg(item, from, to, onOk) {

  // 빠르게: 화면은 먼저 바꾸고, 서버 기록은 뒤에서. 실패하면 되돌림
  const raw0 = getProgRaw(), prev = raw0[k];
  if (to) raw0[k] = { s: to, t: Date.now(), start: (prev && prev.start) || '', done: (prev && prev.done) || '',
                      shared: to === 'shared' && !(prev && prev.shared) ? hmNow() : (prev && prev.shared) || '' }; else delete raw0[k];
  saveProgRaw(raw0);
  const undoLocal = () => { const r = getProgRaw(); if (prev) r[k] = prev; else delete r[k]; saveProgRaw(r); };
  render(); updateBox();
  if (onOk) { try { onOk(); } catch (e) {} onOk = null; }
  const info = { d: curD, rk: k, veh: item.veh, title: item.title, route: item.route, n: item.n,
                 s: item.pending ? '' : item.s, time: item.time, from: from, to: to };
  const end = () => { delete busy[k]; render(); if (currentItem && rkOf(currentItem) === k) updateBox(); };
  run()
    .withSuccessHandler(r => {
      if (r && r.ok) { applyServerProg(item, r.prog); say(''); end(); if (onOk) onOk(); return; }
      if (r && r.reason === 'busy') { undoLocal(); say('먼저 운행중인 ' + r.other + '를 완료하세요'); end(); load(curD, true); return; }
      if (r && r.conflict) {
        applyServerProg(item, r.prog);
        const st = r.prog && r.prog.state;
        say(r.error === '취소된 배차' ? '취소된 배차입니다.' : st ? '이미 다른 곳에서 ' + STATE_NAME[st] + '입니다' : '이미 다른 곳에서 대기로 바뀌었습니다');
        end(); return;
      }
      undoLocal(); say('기록 실패 – 다시 눌러 주세요' + (r && r.error ? ' (' + r.error + ')' : '')); end();
    })
    .withFailureHandler(() => { undoLocal(); say('기록 실패 – 다시 눌러 주세요'); end(); })
    .logProgress(AUTH, info);
}
// 서버(진행요약)와 병합: 서버가 더 최근이면 서버 값
let serverProg = {};
const esc = t => String(t).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
function mergeProgress(server) {
  serverProg = server || {};
  if (!server) return;
  const p = getProgRaw();
  // 서버(진행요약)에 없는 카드키 = 서버 기준 대기 → 로컬에 남은 진행중/완료 지움 (처리중 요청 제외)
  for (const k in p) if (!(k in server) && !busy[k]) delete p[k];
  for (const k in server) {
    const sv = server[k], lv = p[k];
    const lt = lv && typeof lv === 'object' ? lv.t || 0 : 0;
    if (!lv || sv.ts >= lt) {
      if (sv.state) p[k] = { s: sv.state, t: sv.ts, start: sv.start, done: sv.done, shared: sv.shared || '' }; else delete p[k];
    }

}
let lastTap = 0;
const debounced = () => { const n = Date.now(); if (n - lastTap < 400) return true; lastTap = n; return false; };
// 카드 버튼: 항상 메시지 상자를 연다 (상태 변경은 상자 안의 버튼으로)
function tapCard(item) {
  if (debounced() || item.cancelled) return;
  showMsg(item);
}
const curProg = item => getProg()[rkOf(item)] || '';
// 같은 차량의 다른 진행중 카드 (차량당 1건 규칙, 화면 사전 확인)
function otherRunning(item) {
  const prog = getProg();
  return (data[item.veh] || []).find(x => rkOf(x) !== rkOf(item) && !x.cancelled && prog[rkOf(x)] === 'run') || null;
}
const jobName = x => x.route + ' ' + x.n + '차';
function boxStateTap() {
  const item = currentItem; if (!item || debounced() || busy[rkOf(item)]) return;
  const pr = curProg(item);
  const o = (pr === '' || pr === 'shared') ? otherRunning(item) : null;   // 운행 시작만 막음 (차량당 운행중 1건)
  if (o) { say('먼저 운행중인 ' + jobName(o) + '를 완료하세요'); return; }
  if (pr === '' || pr === 'shared') requestProg(item, pr, 'run', () => say('운행 시작했어요.'));
  else if (pr === 'run') requestProg(item, 'run', 'done', () => { closeBox(); say('완료 처리했어요.'); });
}
function boxUndoTap() {
  const item = currentItem; if (!item || debounced() || busy[rkOf(item)]) return;
  const pr = curProg(item);

    const o = otherRunning(item);
    if (o) { say('먼저 운행중인 ' + jobName(o) + '를 완료하세요'); return; }
    requestProg(item, 'done', 'run', () => say('운행중으로 되돌렸어요.'));
  }
  else if (pr === 'run') {   // 공유했던 카드는 공유됨으로, 아니면 대기로
    if (progInfo(item).shared) requestProg(item, 'run', 'shared', () => say('공유됨으로 되돌렸어요.'));

  else if (pr === 'shared') requestProg(item, 'shared', '', () => say('대기로 되돌렸어요.'));

function closeBox() { document.getElementById('msgBox').style.display = 'none'; currentItem = null; currentMsg = ''; currentId = null; say(''); }
// 상자 안 버튼/표시를 현재 상태에 맞춤

  sb.style.display = pr === 'done' ? 'none' : 'block';
  sb.textContent = pr === 'run' ? '✔ 완료 처리' : '▶ 운행 시작 (상차 완료 후)';
  sb.className = 'state-btn' + (pr === 'run' ? ' to-done' : '');
  const o = (pr === '' || pr === 'shared' || pr === 'done') ? otherRunning(item) : null;
  sb.disabled = isBusy || ((pr === '' || pr === 'shared') && !!o);
  ub.style.display = (pr || sentState(item).state !== 'none') ? 'block' : 'none'; ub.disabled = isBusy || (pr === 'done' && !!o);
  document.getElementById('boxState').textContent = '현재 상태: ' + STATE_NAME[pr] + (pr === 'done' ? ' (보내기 잠김 · 되돌리기만 가능)' : '') +
    (o ? '\n운행 시작 전에 먼저 운행중인 ' + jobName(o) + '를 완료하세요 (카톡 공유는 가능)' : '');

}

function render() { renderCards(); renderBoard(); placeBox(); }
// 관리자: 차량 현황 (차량마다 1줄. 운행중 → 공유됨 → 대기 → 끝 순)
// 납입 예정 시각: 근무일(curD) + 납입시간, 07:00 이전·24:00 이후 = 다음날 (근무일 07:00~25:50)
function dueTime(item) {
  const t = String(item.first || item.time || '').match(/(\d{1,2}):(\d{2})/);
  if (!t || !/^\d{4}$/.test(curD)) return null;
  const now = new Date(); let y = now.getFullYear();
  let base = new Date(y, +curD.slice(0, 2) - 1, +curD.slice(2));
  if (base - now > 180 * 864e5) base = new Date(y - 1, base.getMonth(), base.getDate());
  else if (now - base > 180 * 864e5) base = new Date(y + 1, base.getMonth(), base.getDate());
  const h = +t[1];
  return new Date(base.getTime() + ((h < 7 ? h + 24 : h) * 60 + +t[2]) * 60000);
}
function renderBoard() {
  const el = document.getElementById('board');
  if (MODE !== 'admin') { el.style.display = 'none'; return; }
  const prog = getProg(), rows = [], now = Date.now();
  for (const [veh, items] of Object.entries(data || {})) {
    if (/차량 미정/.test(veh)) continue;
    const list = [...items].sort((a, b) => a.min - b.min), live = list.filter(x => !x.cancelled);
    const runIt = live.find(x => prog[rkOf(x)] === 'run');
    const shIt = live.find(x => prog[rkOf(x)] === 'shared');
    const done = live.filter(x => prog[rkOf(x)] === 'done').length;
    const next = live.find(x => !prog[rkOf(x)]);
    const late = live.filter(x => prog[rkOf(x)] !== 'done' && (d => d && d.getTime() < now)(dueTime(x)));
    const rank = runIt ? 0 : shIt ? 1 : (done < live.length ? 2 : 3);
    const firstMin = live.length ? live[0].min : 99999;
    rows.push({ veh, runIt, shIt, next, late, done, total: live.length, rank, firstMin });
  }
  if (!rows.length) { el.style.display = 'none'; return; }
  rows.sort((a, b) => a.rank - b.rank || a.firstMin - b.firstMin);
  const fld = (it, f) => { const k = rkOf(it), v = progInfo(it); return v[f] || (serverProg[k] && serverProg[k][f]) || ''; };
  const BADGE = ['<span class="bd-badge run">▶ 운행중</span>', '<span class="bd-badge shared">📤 공유됨</span>',
                 '<span class="bd-badge wait">대기</span>', '<span class="bd-badge end">오늘 배차 끝</span>'];
  el.innerHTML = '<div class="bd-title">차량 현황</div>' + rows.map((r, i) => {
    const subs = [];
    if (r.runIt) subs.push('▶ ' + jobName(r.runIt) + (fld(r.runIt, 'start') ? ' · ' + fld(r.runIt, 'start') + ' 시작' : ''));
    else if (r.shIt) subs.push('📤 ' + jobName(r.shIt) + (fld(r.shIt, 'shared') ? ' · ' + fld(r.shIt, 'shared') + ' 공유' : ''));
    if (r.next) subs.push('다음 ' + jobName(r.next) + (r.next.first ? ' ' + r.next.first : ''));
    const lateTxt = r.late.length ? '⚠ 납입시간 지남: ' + r.late.map(x => jobName(x) + (x.first ? ' ' + x.first : '')).join(', ') : '';
    return '<div class="bd-row" data-i="' + i + '"><div class="bd-main"><div class="bd-veh">' + esc(r.veh) + '</div>' +
      (subs.length ? '<div class="bd-sub">' + esc(subs.join('  ·  ')) + '</div>' : '') +
      (lateTxt ? '<div class="bd-late">' + esc(lateTxt) + '</div>' : '') + '</div>' +
      '<div style="text-align:right">' + BADGE[r.rank] + '<div class="bd-cnt">완료 ' + r.done + '/' + r.total + '</div></div></div>';
  }).join('');

    const veh = rows[+rowEl.dataset.i].veh;
    const g = [...document.querySelectorAll('#container .group')].find(x => x.dataset.veh === veh);
    if (g) g.scrollIntoView({ behavior: 'smooth', block: 'start' });

}
// 메시지 상자를 누른 카드 바로 아래에 붙임 (스크롤 안 움직이게)
function placeBox() {
  const mb = document.getElementById('msgBox');
  if (!currentItem || mb.style.display !== 'block') return;
  const k = rkOf(currentItem);
  const b = [...document.querySelectorAll('#container [data-rk]')].find(x => x.dataset.rk === k);
  if (b && b.nextSibling !== mb) b.parentNode.insertBefore(mb, b.nextSibling);

function renderCards() {
  const c = document.getElementById('container');

  c.innerHTML = '';

    const div = document.createElement('div'); div.className = 'group'; div.dataset.veh = vehicle;
    const t = document.createElement('div'); t.className = 'group-title'; t.textContent = vehicle + ' (' + items.length + ')';
    div.appendChild(t);

      const b = document.createElement('button');
      const ss = sentState(item, st), pr = prog[rkOf(item)] || '', changed = ss.state === 'changed';

      else if (pr === 'shared') { cls += ' shared'; label += '  📤 공유됨'; }

function applyPending(item) {
  const pend = !!(item && item.pending);
  document.getElementById('sendBtn').disabled = pend;
  document.getElementById('pendNote').style.display = pend ? 'block' : 'none';
}
function showTimes(item) {
  const el = document.getElementById('timeLine');
  if (MODE !== 'admin' || !item) { el.style.display = 'none'; return; }
  const pi = progInfo(item);
  el.textContent = '공유 ' + (pi.shared || '–') + ' · 운행 시작 ' + (pi.start || '–') + ' · 완료 ' + (pi.done || '–');
  el.style.display = 'block';
}
function showMsg(item) {
  if (item.cancelled) return;
  applyPending(item);
  showTimes(item);
  currentMsg = outMsg(item.msg); currentId = item.id; currentItem = item;
  const ss = sentState(item), dl = document.getElementById('diffLine');
  dl.textContent = ss.state === 'changed' ? diffLine(ss.prev, item.msg) : '';
  dl.style.display = ss.state === 'changed' ? 'block' : 'none';

  box.style.display = 'block';

  placeBox();
  try { box.scrollIntoView({ behavior: 'smooth', block: 'nearest' }); } catch (e) {}
  say(curProg(item) === 'done' ? '완료된 배차예요 (읽기 전용).' : '');
}
// 카톡 보내기 = 배차 공유 (대기일 때만 → 공유됨). 운행 시작은 따로
function sentAndRun() {
  const item = currentItem; if (!item) return;
  setSent(item); document.getElementById('diffLine').style.display = 'none';
  if (curProg(item) === '') requestProg(item, '', 'shared', () => {}); else render();
}
function markSent() { if (currentItem) { setSent(currentItem); document.getElementById('diffLine').style.display = 'none'; render(); } }

function sendViaKakaoSdk() {
  if (!currentMsg || !kakaoReady || (currentItem && currentItem.pending)) return false;
  try {
    const url = APP_URL || 'https://script.google.com';
    Kakao.Share.sendDefault({ objectType: 'text', text: currentMsg, link: { mobileWebUrl: url, webUrl: url } });
    markSent(); say('카톡에서 받을 방을 고르고 전송하세요.');
    return true;
  } catch (e) { say('카카오 공유 실패: ' + e.message); return false; }
}

// Apps Script는 iframe(googleusercontent.com)에서 실행 → 1순위 휴대폰 공유창, 2순위 카카오 SDK, 3순위 복사
// Apps Script 페이지는 샌드박스 iframe 안 → navigator.share/카카오 SDK가 막힘.
// 그래서: (1) 탭하는 순간 동기 복사 → (2) 같은 탭(사용자 제스처) 안에서 카카오톡 앱 열기 → 방에서 붙여넣기
const IS_ANDROID = /Android/i.test(navigator.userAgent);
const IN_IFRAME = (() => { try { return window.self !== window.top; } catch (e) { return true; } })();
const KAKAO_INTENT = 'intent://main#Intent;scheme=kakaotalk;package=com.kakao.talk;end';

function copySync(text) {
  let ok = fallbackCopy(text);   // execCommand: 클릭 처리 안에서 동기 실행, iframe에서도 대부분 동작
  try { if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(text).catch(() => {}); } catch (e) {}
  return ok;
}
// 안드로이드: 카톡 공유(SEND) 화면 → 방 선택하면 메시지가 입력된 상태로 열림
const kakaoShareIntent = text => 'intent:#Intent;action=android.intent.action.SEND;type=text/plain;package=com.kakao.talk;S.android.intent.extra.TEXT=' + encodeURIComponent(text) + ';end';
function openKakaoApp(text) {
  const url = IS_ANDROID ? (text ? kakaoShareIntent(text) : KAKAO_INTENT) : KAKAO_SCHEME;
  const a = document.createElement('a');
  a.href = url; a.target = '_top'; a.rel = 'noopener'; a.style.display = 'none';
  document.body.appendChild(a);
  try { a.click(); } catch (e) {}
  document.body.removeChild(a);
  // 안드로이드에서 intent가 막히면 스킴으로 한 번 더 (앱이 열리면 페이지가 숨겨져 실행 안 됨)
  if (IS_ANDROID) setTimeout(() => {
    if (document.hidden) return;
    try { window.open(KAKAO_SCHEME, '_top'); } catch (e) {}
  }, 800);
}

async function sendKakao() {
  if (!currentMsg || (currentItem && (currentItem.pending || curProg(currentItem) === 'done'))) return;
  // v28: 보내기(공유)는 같은 차량에 운행중 배차가 있어도 가능 (운행 시작만 막음)
  // 1순위: 최상위 창(iframe 아님)이고 공유 기능이 있으면 휴대폰 공유창
  if (!IN_IFRAME && !IS_ANDROID && navigator.share) {   // 안드로이드는 카톡 공유 인텐트(kakaoShareIntent)가 1순위
    try { await navigator.share({ text: currentMsg }); sentAndRun(); say('보냈어요.'); return; }
    catch (e) { if (e.name === 'AbortError') { say('취소됨'); return; } }
  }
  // 2순위(Apps Script 기본 경로): 동기 복사 + 카카오톡 앱 열기 — await 없이 제스처 안에서
  const ok = copySync(currentMsg);
  if (ok) {
    sentAndRun();
    say(IS_ANDROID ? '카톡에서 받을 방을 고르세요 (메시지 자동 입력 · 안 들어가면 길게 눌러 붙여넣기)' : '복사됨 → 카톡에서 받을 방 열고 길게 눌러 붙여넣기');
    openKakaoApp(currentMsg);
    return;
  }
  // 복사 실패 시: 카카오 SDK(키 있을 때) → 수동 복사 안내
  if (kakaoReady && sendViaKakaoSdk()) return;
  say('복사가 안 돼요. 메시지를 길게 눌러 복사한 뒤 카톡에 붙여넣으세요.');
}

function fallbackCopy(text) {
  const ta = document.createElement('textarea'); ta.value = text; ta.setAttribute('readonly', '');
  ta.style.position = 'fixed'; ta.style.opacity = '0'; document.body.appendChild(ta);
  ta.select(); ta.setSelectionRange(0, text.length);
  let ok = false; try { ok = document.execCommand('copy'); } catch (e) {}
  document.body.removeChild(ta); return ok;
}
function copyMsg() {
  if (!currentMsg) return;
  const done = () => { markSent(); say('복사 완료! 카톡에 붙여넣기 하세요.'); };
  const fail = () => fallbackCopy(currentMsg) ? done() : say('메시지를 길게 눌러 복사하세요.');
  if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(currentMsg).then(done).catch(fail);
  else fail();
}

function showSheetInfo() {
  run().withSuccessHandler(r => {
    if (!r.ok) return;
    document.getElementById('curSheet').textContent = '현재: ' + r.name + (r.isDefault ? ' (기본값)' : '');
  }).getSheetInfo(AUTH);
}
function saveSheet() {
  const u = document.getElementById('sheetUrl').value;
  if (!u.trim()) return;
  const msg = document.getElementById('setMsg'); msg.textContent = '확인 중…';
  run()
    .withSuccessHandler(r => {
      if (!r.ok) { msg.textContent = '❌ ' + r.error; return; }
      msg.textContent = '✅ 저장됨: ' + r.name + ' (날짜 탭 ' + r.tabs + '개)';
      document.getElementById('sheetUrl').value = '';
      showSheetInfo(); load(curD);
    })
    .withFailureHandler(e => { msg.textContent = '❌ ' + e.message; })
    .setSheet(u, AUTH);
}
run().withSuccessHandler(cfg => {
  if (!cfg || !cfg.ok) { document.getElementById('info').textContent = (cfg && cfg.error) || '접근 권한이 없습니다.'; return; }
  MODE = cfg.mode; CAR = cfg.car; KAKAO_JS_KEY = cfg.kakaoKey || '';
  if (MODE === 'driver') document.getElementById('carTag').textContent = ' · ' + CAR;
  try { if (KAKAO_JS_KEY && window.Kakao) { if (!Kakao.isInitialized()) Kakao.init(KAKAO_JS_KEY); kakaoReady = Kakao.isInitialized(); } } catch (e) {}
  if (kakaoReady) document.getElementById('kakaoBtn').style.display = 'block';
  if (MODE === 'admin') { document.getElementById('adminSettings').style.display = 'block'; document.getElementById('adminReset').style.display = 'block'; showSheetInfo(); }
  load(curD || todayMmdd());
}).withFailureHandler(e => { document.getElementById('info').textContent = '오류: ' + e.message; }).config();
</script>
