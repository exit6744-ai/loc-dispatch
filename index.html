<style>
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; max-width: 480px; margin: 0 auto; padding: 12px; background: #f5f5f5; }

  .nav input { flex: 2; text-align: center; }
  .group { background: white; border-radius: 12px; padding: 14px; margin-bottom: 14px; }
  .group-title { font-weight: bold; margin-bottom: 10px; font-size: 16px; }
  .btn { width: 100%; padding: 14px; margin-bottom: 8px; background: #fee500; border: none; border-radius: 10px; font-size: 15px; font-weight: bold; text-align: left; }
  .btn.used { background: #ddd; color: #777; }
  .btn.changed { background: #e53935; color: #fff; }
  #diffLine { display: none; font-size: 13px; color: #e53935; font-weight: bold; margin-bottom: 8px; }
  #msgBox { display: none; margin-top: 6px; background: white; border-radius: 12px; padding: 14px; margin-bottom: 14px; box-shadow: 0 2px 8px rgba(0,0,0,0.15); }

  .send-btn { width: 100%; padding: 16px; background: #fee500; color: #3c1e1e; border: 2px solid #3c1e1e; border-radius: 8px; font-size: 17px; font-weight: bold; margin-bottom: 8px; }
  .copy-btn { width: 100%; padding: 12px; background: #3c1e1e; color: #fee500; border: none; border-radius: 8px; font-size: 15px; font-weight: bold; margin-bottom: 8px; }

  .tc { color: #d50000; background: #fff; border-radius: 4px; padding: 0 3px; font-weight: bold; }
  .tc-badge { display: inline-block; font-size: 11px; font-weight: bold; color: #fff; background: #d50000; border-radius: 8px; padding: 1px 6px; margin-left: 4px; vertical-align: middle; }
  #tcLine { display: none; font-size: 13px; font-weight: bold; color: #d50000; margin-bottom: 6px; }
  #tcLine.strong { background: #ffebee; border: 2px solid #d50000; border-radius: 8px; padding: 6px 8px; }
  #timeLine { display: none; font-size: 12px; color: #1e88e5; margin-bottom: 6px; }
  .btn.cancelled { background: #e0e0e0; color: #777; }
  .btn.cancelled.cancel-alert { border: 3px solid #e53935; color: #c62828; }
  .state-row { display: flex; gap: 8px; margin-top: 10px; }
  .state-btn { flex: 2; padding: 14px; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; background: #1e88e5; color: #fff; }
  .state-btn.to-done { background: #43a047; }
  .state-btn:disabled, .undo-btn:disabled { opacity: .5; }
  .undo-btn { flex: 1; padding: 14px; border: 1px solid #999; border-radius: 8px; background: #fff; font-size: 14px; }
  .box-state { white-space: pre-line; text-align: center; font-size: 13px; color: #555; margin-top: 6px; }
  .close-btn { width: 100%; margin-top: 8px; padding: 10px; border: none; border-radius: 8px; background: #eee; }
  .btn.done-mini { padding: 8px 12px; margin-bottom: 6px; font-size: 13px; font-weight: normal; background: #eeeeee; color: #888; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .done-row { display: flex; align-items: center; gap: 8px; }
  .done-row .btn { flex: 1; }
  .undo { font-size: 12px; color: #555; white-space: nowrap; margin-bottom: 8px; }
  .btn.pending { border: 2px dashed #3c1e1e; }

  .pend-note { display: none; font-size: 13px; color: #b26a00; margin: -2px 0 8px; }
  .settings { background: #fff; border-radius: 12px; padding: 12px; margin: 14px 0; font-size: 13px; }
  .settings input { width: 100%; box-sizing: border-box; padding: 10px; margin: 4px 0 8px; border: 1px solid #ccc; border-radius: 6px; font-size: 14px; }
  .settings button { width: 100%; padding: 10px; background: #3c1e1e; color: #fee500; border: none; border-radius: 8px; font-weight: bold; }
  .set-title { font-weight: bold; margin-top: 4px; }
  .set-cur { color: #666; font-size: 12px; margin-top: 4px; word-break: break-all; }
  .reset { width: 100%; padding: 12px; background: #eee; border: none; border-radius: 8px; }
  .skip { font-size: 12px; color: #888; margin: 8px 0 14px; white-space: pre-wrap; }
  #board { display: none; background: #fff; border-radius: 12px; padding: 10px 12px; margin-bottom: 14px; }
  .bd-title { font-weight: bold; font-size: 15px; margin-bottom: 6px; }

  .bd-row:first-of-type { border-top: none; }

  .bd-veh { font-weight: bold; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .bd-sub { font-size: 12px; color: #555; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .bd-badge { font-size: 12px; font-weight: bold; padding: 4px 8px; border-radius: 12px; white-space: nowrap; }
  .bd-badge.run { background: #1e88e5; color: #fff; }
  .bd-badge.shared { background: #cfe2f3; color: #1a3550; }
  .bd-late { font-size: 12px; color: #e53935; font-weight: bold; margin-top: 2px; }

  .bd-cnt { font-size: 11px; color: #888; white-space: nowrap; }

<body>
<h1 onclick="goToday()" style="cursor:pointer">Kora_LOC 운송 일정<span id="carTag"></span></h1>
<div class="nav">

<div class="info" id="advNote" style="display:none;color:#0a7"></div>

<div id="locWarn" style="display:none;margin:6px 0;padding:10px;background:#d32f2f;color:#fff;border-radius:8px;font-size:15px;font-weight:bold;text-align:center">⚠ 위치 전송 중지됨 – 화면을 켜 두세요<div id="locWarnSub" style="font-size:12px;font-weight:normal;margin-top:3px"></div></div>
<div id="locAsk" style="display:none;margin:6px 0;padding:8px 10px;background:#eef6ff;border:1px solid #b6d4f5;border-radius:8px;font-size:13px;color:#1a3550">📍 운행 중 차량 위치를 관리자에게 알려 주기 위해 위치 권한을 사용해요. (공유·시작·완료 때와 운행 중 약 3분마다, 화면이 켜져 있을 때만)<br><button id="locAskBtn" style="margin-top:6px;padding:4px 12px">위치 허용</button> <button id="locAskNo" style="margin-top:6px;padding:4px 12px">나중에</button></div>

  <div id="timeLine"></div>
  <div id="diffLine"></div>
  <div id="tcLine"></div>
  <div id="msgContent"></div>
  <button class="send-btn" id="sendBtn" onclick="sendKakao()">💬 카톡으로 보내기</button>
  <div class="pend-note" id="pendNote">Consol No.가 아직 없어요 (16시 이후 업데이트). 카톡 보내기는 Consol No.가 나온 뒤에 — 지금은 복사만 가능.</div>
  <button class="copy-btn" onclick="copyMsg()">메시지 복사하기</button>

  <div class="state-row">
    <button class="state-btn" id="stateBtn" onclick="boxStateTap()"></button>

<div class="settings" id="adminSettings" style="display:none">
  <div class="set-title">⚙ 이번 달 시트 주소</div>
  <div class="set-cur" id="curSheet">현재: 불러오는 중…</div>
  <input id="sheetUrl" placeholder="구글 시트 주소 또는 ID">
  <button onclick="saveSheet()">저장</button>
  <div class="set-cur" id="setMsg">※ 구글 시트(네이티브)만 가능 · 엑셀(.xlsx)은 'Google Sheets로 저장' 후 사용</div>
</div>
<button class="reset" id="adminReset" style="display:none" onclick="resetAll()">보냄·진행 표시 초기화 (이 날짜)</button>
<script>
// ── GitHub Pages 버전: Apps Script JSON API 호출 ──
const GAS_URL = 'https://script.google.com/macros/s/AKfycbwAHlScc1rdABNJQPGKJkmRF0ZsE_Urm-shAIGRcEkpyrord5u-Mp4I6fLg1fiWVWkx/exec';
const QS = new URLSearchParams(location.search);
const AUTH = QS.get('key') ? { key: QS.get('key') } : { car: QS.get('car') || '' };
let KAKAO_JS_KEY = '', APP_URL = location.origin + location.pathname;
let curD = /^\d{4}$/.test(QS.get('d') || '') ? QS.get('d') : '';
let MODE = 'none', CAR = '';
function jsonp(params) {
  return new Promise((ok, no) => {
    const cb = '__gas' + Date.now() + Math.floor(Math.random() * 1e6), s = document.createElement('script');
    const clean = () => { delete window[cb]; s.remove(); clearTimeout(t); };
    const t = setTimeout(() => { clean(); no(new Error('시간 초과')); }, 45000);
    window[cb] = r => { clean(); ok(r); };
    s.onerror = () => { clean(); no(new Error('네트워크 오류')); };
    params.set('callback', cb); s.src = GAS_URL + '?' + params; document.head.appendChild(s);
  });
}
// api(name, extra) → Promise(결과). fetch(GET, CORS) 네트워크/CORS 오류일 때만 JSONP로 재시도
// (서버가 HTTP 오류·잘못된 JSON 을 준 경우엔 재시도 안 함 → 느린 서버 호출 2번 방지)
let PREFETCH = null;   // 첫 화면: config 와 getCards 를 동시에 보냄
function api(name, extra) {
  if (name === 'getCards' && PREFETCH && extra && PREFETCH.d === extra.d) { const p = PREFETCH.p; PREFETCH = null; return p; }
  const q = new URLSearchParams(Object.assign({ api: name }, AUTH));
  for (const k in (extra || {})) q.set(k, typeof extra[k] === 'string' ? extra[k] : JSON.stringify(extra[k]));
  return fetch(GAS_URL + '?' + q, { method: 'GET', redirect: 'follow', credentials: 'omit' })
    .then(r => { if (!r.ok) { const e = new Error('HTTP ' + r.status); e.http = true; throw e; } return r.json().catch(e => { e.http = true; throw e; }); },
          () => jsonp(q))
    .then(r => { if (r && r._err) throw new Error(r.error || '서버 오류'); return r; });
}
// 예전 script.run 과 같은 모양: run().withSuccessHandler(f).withFailureHandler(g).함수(...)
const ARGS = { getCards: (d, a) => ({ d: d }), logProgress: (a, info) => ({ info: info }),
               getSheetInfo: a => ({}), setSheet: (url, a) => ({ url: url }), config: () => ({}) };
function run() {
  let ok = () => {}, fail = () => {};
  const o = { withSuccessHandler(f) { ok = f; return o; }, withFailureHandler(f) { fail = f; return o; } };
  for (const n in ARGS) o[n] = (...args) => { api(n, ARGS[n](...args)).then(r => ok(r), e => fail(e)); };
  return o;
}
// 카톡 메시지 맨 위 안내 (상차 현장 준비용)
const MSG_HEAD = '🚚 곧 도착합니다. (약 5분 후)';
const outMsg = m => m.replace(/^([^\n]*)\n\s*\n(→)/, '$1\n$2').replace(/\s+$/, '') + '\n\n' + MSG_HEAD;
let data = {}, currentMsg = '', currentId = null, currentItem = null;
const YEAR = new Date().getFullYear();

let kakaoReady = false;
try { if (KAKAO_JS_KEY && window.Kakao) { if (!Kakao.isInitialized()) Kakao.init(KAKAO_JS_KEY); kakaoReady = Kakao.isInitialized(); } } catch (e) {}
if (kakaoReady) document.getElementById('kakaoBtn').style.display = 'block';

// 보낸 기록: { sid: {S번호: 보낸텍스트}, rk: {'route|차수': {s, msg}} }  (날짜별 키)
const sentKey = () => 'sent_' + curD;
const getSent = () => { try { return JSON.parse(localStorage.getItem(sentKey())) || { sid: {}, rk: {} }; } catch (e) { return { sid: {}, rk: {} }; } };
const rkOf = item => item.rk || (item.route + '|' + item.n);
function setSent(item) {
  const st = getSent();
  st.sid[item.id] = item.msg;
  st.rk[rkOf(item)] = { s: item.id, msg: item.msg };
  localStorage.setItem(sentKey(), JSON.stringify(st));
}
function unSent(item) {
  const st = getSent();
  delete st.sid[item.id]; delete st.rk[rkOf(item)];
  for (const k in st.sid) if (st.sid[k] === item.msg) delete st.sid[k];
  for (const k in st.rk) if (st.rk[k] && (st.rk[k].s === item.id || st.rk[k].msg === item.msg)) delete st.rk[k];
  localStorage.setItem(sentKey(), JSON.stringify(st));
  // 다른 날짜 키에 남은 기록도 정리
  for (let i = 0; i < localStorage.length; i++) {
    const key = localStorage.key(i); if (!key || key.indexOf('sent_') !== 0 || key === sentKey()) continue;
    try { const o = JSON.parse(localStorage.getItem(key)); if (o && o.sid && o.sid[item.id] != null) { delete o.sid[item.id]; localStorage.setItem(key, JSON.stringify(o)); } } catch (e) {}
  }
}
// v26: 같은 노선|차수 카드가 여럿이면 서버가 키에 차량번호를 붙임 (노선|차수|#5833, item.rkBase = 예전 키).
// 예전 키로 저장된 보냄 기록은 보낸 문구에 이 카드 차량번호가 들어 있을 때만 이 카드 것으로 봄 (애매하면 무시)
function oldRkSent_(item, st) {
  if (!item.rkBase) return undefined;
  const o = st.rk[item.rkBase], m = String(item.veh || '').match(/\d{4}(?!.*\d{4})/);
  return o && m && String(o.msg || '').indexOf(m[0]) >= 0 ? o : undefined;
}
// 반환: {state:'none'|'sent'|'changed', prev: 이전 보낸 텍스트}
function sentState(item, st) {
  st = st || getSent();
  const bySid = st.sid[item.id], byRk = st.rk[rkOf(item)] || oldRkSent_(item, st);
  if (bySid != null) return bySid === item.msg ? { state: 'sent' } : { state: 'changed', prev: bySid };
  if (byRk && byRk.s !== item.id) return { state: 'changed', prev: byRk.msg };
  return { state: 'none' };
}
function fieldsOf(msg) {
  const L = String(msg).split('\n'), f = {};
  const val = re => { const l = L.find(x => re.test(x)); return l ? l.replace(re, '').trim() : ''; };
  f['Consol No.'] = val(/^→\s*/); f['Route'] = val(/^▶ Route\s*:\s*/);
  f['납입일자'] = val(/^▶ 납입일자\s*:\s*/); f['납입시간'] = val(/^▶ 납입시간\s*:\s*/);
  const tail = L.slice(L.lastIndexOf('') + 1);
  f['차량'] = tail[0] || ''; f['연락처'] = tail[1] || '';
  return f;
}
function diffLine(prev, cur) {
  const a = fieldsOf(prev), b = fieldsOf(cur), out = [];
  for (const k of Object.keys(b)) {
    if (a[k] === b[k]) continue;
    out.push(k === '차량' || k === '연락처' ? k : k + ' ' + (a[k] || '∅') + '→' + (b[k] || '∅'));
  }
  return out.length ? '바뀜: ' + out.join(', ') : '바뀜: 메시지 내용';
}
function say(t) { document.getElementById('status').textContent = t; }

function mmddToDate(d) { return new Date(YEAR, +d.slice(0, 2) - 1, +d.slice(2)); }
function dateToMmdd(dt) { return ('0' + (dt.getMonth() + 1)).slice(-2) + ('0' + dt.getDate()).slice(-2); }
function isoOf(dt) { return dt.getFullYear() + '-' + ('0' + (dt.getMonth() + 1)).slice(-2) + '-' + ('0' + dt.getDate()).slice(-2); }
// 제목 클릭 → 오늘 근무일 (06:00 이전은 전날 근무일). 일요일(휴무)이면 토요일 탭 → 끝났으면 자동으로 월요일
// v43 오늘 근무일 = 06:00 기준 날짜. 그 탭이 없으면(일요일·휴일) 서버 res.next(10일 안 다음 탭)로 이동 → TAB_FWD 에 기억
let TAB_FWD = {}, AUTO_D = !curD;
function baseMmdd() { const dt = new Date(); if (dt.getHours() < 6) dt.setDate(dt.getDate() - 1); return dateToMmdd(dt); }
function todayMmdd() { const b = baseMmdd(); return TAB_FWD[b] || b; }
function goToday() { closeBox(); advOff(); AUTO_D = true; load(todayMmdd()); }
function shift(n) { advOff(); AUTO_D = false; const dt = mmddToDate(curD); dt.setDate(dt.getDate() + n); load(dateToMmdd(dt)); }
function pick(v) { AUTO_D = false; if (v) { advOff(); load(v.slice(5, 7) + v.slice(8, 10)); } }
// 오늘 배차가 모두 완료/취소 → 다음 근무일 탭 자동 표시 (탭 없으면 오늘 유지). ?d= 지정·날짜 직접 선택 시 끔
let ADV = { on: !curD, trying: '', today: '', next: '' };
function advOff() { ADV.on = false; ADV.trying = ''; showAdvNote(); }
function nextWork(d) { const dt = mmddToDate(d); dt.setDate(dt.getDate() + 1); if (dt.getDay() === 0) dt.setDate(dt.getDate() + 1); return dateToMmdd(dt); }
function todayFinished() {   // 이 날짜 데이터(00:10 완성 1차 포함)의 취소 아닌 카드가 전부 완료 (기사앱은 서버가 그 차량 카드만 줌)
  const prog = getProg(); return [].concat(...Object.values(data || {})).every(x => x.cancelled || prog[rkOf(x)] === 'done');
}
function showAdvNote() {
  const el = document.getElementById('advNote'), show = ADV.on && ADV.next && curD === ADV.next && curD !== todayMmdd();
  el.style.display = show ? 'block' : 'none';
  if (show) el.innerHTML = '오늘 배차 종료 · ' + (curD === dateToMmdd(new Date(mmddToDate(todayMmdd()).getTime() + 864e5)) ? '내일' : '다음 근무일') + '(' + (+curD.slice(0, 2)) + '/' + (+curD.slice(2)) + ') 일정 · <a href="#" onclick="goToday();return false">오늘 보기</a>';
}
function advCheck(res) {
  if (!ADV.on) return;
  const t = todayMmdd();

function fallbackCopy(text) {

}
function copyMsg() {

// 자동 출발: 그 근무일(오늘) 다음 미완료 카드가 대기/공유이고, 상차지 반경 안에 3분 이상 머문 뒤 반경 밖으로 나가면 운행 시작(src 'auto') 1번
const AUTO_DWELL = 3 * 60000, AUTO_KEY = 'autoDep_';
function autoDepTarget() {
  if (MODE !== 'driver' || !GEO_SRV || !GEO.load.length || curD !== todayMmdd()) return null;
  const p = getProg(), all = [].concat(...Object.values(data || {})).filter(x => !x.cancelled && !x.placeholder).sort((a, b) => a.min - b.min);
  if (all.some(x => p[rkOf(x)] === 'run')) return null;
  const nx = all.find(x => p[rkOf(x)] !== 'done');
  if (!nx) return null;
  const pr = p[rkOf(nx)] || '';
  return (pr === '' || pr === 'shared') ? nx : null;
}
function autoDepCheck(c) {
  const it = autoDepTarget();
  if (MODE === 'driver' && curD === todayMmdd()) {                // 1019: 머묾은 카드별 — 운행중이거나 다음 카드가 바뀌면 초기화
    const k0 = AUTO_KEY + curD, rk0 = it ? rkOf(it) : '';
    let s0 = {}; try { s0 = JSON.parse(localStorage.getItem(k0)) || {}; } catch (e) {}
    if (s0.rk !== rk0 || !it) { if (s0.in || s0.last || s0.rk !== rk0) { s0.in = 0; s0.last = 0; s0.rk = rk0; try { localStorage.setItem(k0, JSON.stringify(s0)); } catch (e) {} } }
  }
  if (!it) return;
  const lp = pickByKeys(GEO.load, String(it.route || '') + ' ' + String(it.title || '')); if (!lp) return;
  const acc = Math.min(+c.accuracy || 0, 300), d = distM(c.latitude, c.longitude, lp.lat, lp.lng), rad = +lp.rad || 1000;
  const k = AUTO_KEY + curD, now = Date.now();
  let st = {}; try { st = JSON.parse(localStorage.getItem(k)) || {}; } catch (e) {}
  if (st.fired && st.fired[rkOf(it)]) return;                     // 이 카드는 이미 자동 시도함 (멱등)
  if (d <= rad && acc <= 150) {                                    // 반경 안 (정확도 괜찮을 때만)
    if (!st.in || now - st.last > 30 * 60000) st.in = now;         // 30분 넘게 끊겼으면 새로 머묾 시작
    st.last = now;
  } else if (d > rad + Math.max(100, acc) && st.in && st.last && st.last - st.in >= AUTO_DWELL && now - st.last < 20 * 60000) {   // 1019: 60→20분
    st.fired = st.fired || {}; st.fired[rkOf(it)] = now; st.in = 0; st.last = 0;
    try { localStorage.setItem(k, JSON.stringify(st)); } catch (e) {}
    const pr = curProg(it);
    if ((pr === '' || pr === 'shared') && !busy[rkOf(it)] && !otherRunning(it))
      requestProg(it, pr, 'run', () => say('상차지를 떠나 운행 시작으로 자동 기록했어요.'), 'auto');
    return;
  }
  try { localStorage.setItem(k, JSON.stringify(st)); } catch (e) {}
}
// 화면 꺼짐 방지 (운행중일 때만). 지원 안 하는 폰(옛 iOS/안드로이드)은 조용히 넘어감 → 배너로 안내
let wakeLock = null, locLastOk = 0, locVisibleSince = Date.now();
function wakeSync() {
  if (MODE !== 'driver') return;
  const want = !document.hidden && locHasRun();
  if (!('wakeLock' in navigator)) return;
  if (want && !wakeLock) {
    wakeLock = 'pending';
    navigator.wakeLock.request('screen').then(l => { wakeLock = l; l.addEventListener('release', () => { if (wakeLock === l) wakeLock = null; }); })
      .catch(() => { wakeLock = null; });
  } else if (!want && wakeLock && wakeLock !== 'pending') { try { wakeLock.release(); } catch (e) {} wakeLock = null; }
}
function locWarnCheck() {
  const el = document.getElementById('locWarn'); if (!el) return;
  let show = false, sub = '';
  if (LOC_ON && MODE === 'driver' && !document.hidden && locHasRun()) {
    const denied = localStorage.getItem('locDeny') === '1' || !navigator.geolocation;
    const since = Math.max(locLastOk, locVisibleSince);
    if (denied) { show = true; sub = '위치 권한이 꺼져 있어요 → 휴대폰 설정에서 이 사이트(브라우저) 위치 허용'; }
    else if (Date.now() - since > 5 * 60000) { show = true; sub = '5분 넘게 위치를 못 보냈어요 · 통신·GPS 확인'; }
    if (show && !('wakeLock' in navigator)) sub += ' · 이 폰은 화면 켜짐 유지 미지원 → 설정에서 화면 꺼짐 시간 늘리기';
  }

let locAdminBusy = false;   // v37: 위치 요청 중복 방지
function locLoadAdmin() {
  if (!LOC_ON || MODE !== 'admin' || document.hidden || locAdminBusy) return;
  locAdminBusy = true; setTimeout(() => { locAdminBusy = false; }, 20000);
  api('getLocs', {}).then(r => { locAdminBusy = false; if (r && r.ok) { LOCS = r.locs || {}; ARRS = r.arrs || {}; renderBoard(); } }).catch(() => { locAdminBusy = false; });
}
function locHtml(veh, runIt) {
  if (!LOC_ON) return '';
  const ac = Object.keys(ARRS).find(c => new RegExp('(^|\\D)' + c + '(\\D|$)').test(veh));
  const at = ac ? (d => ' <span style="background:#2e7d32;color:#fff;border-radius:8px;padding:0 6px;font-size:11px">도착 ' + String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0') + '</span>')(new Date(ARRS[ac].ms)) : '';
  const car = Object.keys(LOCS).find(c => new RegExp('(^|\\D)' + c + '(\\D|$)').test(veh));
  if (!car) return at ? '<div class="bd-loc" style="font-size:12px;margin-top:2px">' + at + '</div>' : '';
  const L = LOCS[car], ago = Math.max(0, Math.round((Date.now() - L.ms) / 60000)), d = new Date(L.ms);
  const hm = String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
  const agoTxt = ago < 1 ? '방금' : ago < 60 ? ago + '분 전' : ago < 1440 ? Math.floor(ago / 60) + '시간 전' : Math.floor(ago / 1440) + '일 전';
  let extra = '';   // v38: 운행중이면 위치 끊김 / ETA / 구간
  if (runIt) {
    const txt = String(runIt.route || '') + ' ' + String(runIt.title || '');
    if (ago > 15) extra += ' <span style="background:#d32f2f;color:#fff;border-radius:8px;padding:0 6px;font-size:11px">⚠ 위치 끊김 ' + ago + '분</span>';
    else { const sg = segOf(txt, L.lat, L.lng); if (sg) extra += ' <span style="color:#333">· ' + esc(sg) + '</span>'; }
    const dest = !at && pickByKeys(GEO.dests, txt);
    if (dest) {
      const dm = distM(L.lat, L.lng, dest.lat, dest.lng), now = Math.max(Date.now(), L.ms);
      const eta = dm <= (dest.rad || 300) ? now : now + dm * (GEO.road || 1.55) / ((GEO.kmh || 50) / 3.6) * 1000, due = dueTime(runIt);
      const lateE = !!(due && eta > due.getTime());
      extra += ' <span style="background:' + (lateE ? '#ef6c00' : '#e3f2fd') + ';color:' + (lateE ? '#fff' : '#0d47a1') + ';border-radius:8px;padding:0 6px;font-size:11px">도착 ~' + hhmm(eta) + (lateE ? ' (납입 ' + hhmm(due.getTime()) + ' 지남)' : '') + '</span>';
    }
  }
  const old = ago > 15, k = 'https://map.kakao.com/link/map/' + encodeURIComponent(car) + ',' + L.lat + ',' + L.lng;
  const n = 'https://map.naver.com/p/search/' + L.lat + ',' + L.lng;
  return '<div class="bd-loc" style="font-size:12px;margin-top:2px;color:' + (old ? '#aaa' : '#1565c0') + '">📍 위치 ' + hm + ' · ' + agoTxt +
    ' &nbsp;<a href="' + k + '" target="_blank" rel="noopener" style="color:inherit">카카오맵</a> · <a href="' + n + '" target="_blank" rel="noopener" style="color:inherit">네이버</a>' + at + extra + '</div>';
}
